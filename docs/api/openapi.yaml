openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: Learning Loop Agent API
  version: 0.1.0
  description: |
    AI 学习工具的目标 HTTP 契约。它覆盖 Ticket 01-15，是后端实现和前端集成的共同输入，
    不表示当前后端已经完成。除文件上传与下载外，请求和响应均使用 application/json。
  x-contract-status: target

servers:
  - url: http://127.0.0.1:4173
    description: 本地开发服务

security: []

tags:
  - name: System
  - name: Subjects
  - name: Models
  - name: Sources
  - name: Chat
  - name: Artifacts
  - name: Blueprints
  - name: ExamDrafts
  - name: Exams
  - name: Attempts
  - name: Rendering
  - name: Operations
  - name: Observability
  - name: Evaluations

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: 存活检查
      x-tickets: ['01']
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Health

  /api/workspace:
    get:
      operationId: getWorkspace
      tags: [System]
      summary: 读取工作区导航状态
      description: 返回科目空间和模型服务摘要，不内嵌资料、会话、试卷或 API Key。
      x-tickets: ['01', '02']
      responses:
        '200':
          description: 当前工作区
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Workspace

  /api/subjects:
    get:
      operationId: listSubjects
      tags: [Subjects]
      summary: 列出科目空间
      x-tickets: ['01']
      responses:
        '200':
          description: 科目空间列表
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/SubjectList
    post:
      operationId: createSubject
      tags: [Subjects]
      summary: 创建并激活科目空间
      x-tickets: ['01']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/SubjectInput
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Subject
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/subjects/{subject_id}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: getSubject
      tags: [Subjects]
      summary: 读取科目空间
      x-tickets: ['01']
      responses:
        '200':
          description: 科目空间
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Subject
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateSubject
      tags: [Subjects]
      summary: 重命名科目空间
      x-tickets: ['01']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/SubjectInput
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Subject
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteSubject
      tags: [Subjects]
      summary: 删除科目空间
      description: 删除其当前数据；已导出的副本不受影响。存在运行中任务时拒绝删除。
      x-tickets: ['01']
      responses:
        '204': {description: 已删除}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/subjects/{subject_id}/activate:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: activateSubject
      tags: [Subjects]
      summary: 激活科目空间
      x-tickets: ['01']
      responses:
        '200':
          description: 已激活
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Workspace
        '404': {$ref: '#/components/responses/NotFound'}

  /api/models:
    get:
      operationId: listModels
      tags: [Models]
      summary: 列出模型服务
      x-tickets: ['02', '05']
      responses:
        '200':
          description: 模型服务列表
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/ModelServiceList
    post:
      operationId: createModel
      tags: [Models]
      summary: 添加模型服务
      x-tickets: ['02', '05']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/ModelServiceInput
      responses:
        '201':
          description: 已添加；响应不返回 API Key
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/ModelService
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/models/{model_id}:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    get:
      operationId: getModel
      tags: [Models]
      summary: 读取模型服务
      x-tickets: ['02', '05']
      responses:
        '200':
          description: 模型服务；不返回 API Key
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/ModelService
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateModel
      tags: [Models]
      summary: 更新模型服务
      x-tickets: ['02', '05']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/ModelServicePatch
      responses:
        '200':
          description: 已更新；验证状态被重置
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/ModelService
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteModel
      tags: [Models]
      summary: 删除模型服务
      description: 历史 AI 消息和批改结果中的模型快照保持不变。
      x-tickets: ['02']
      responses:
        '204': {description: 已删除}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/models/{model_id}/verify:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    post:
      operationId: verifyModel
      tags: [Models, Operations]
      summary: 验证模型服务和能力
      description: 验证文本输入，并按配置或能力探测记录是否支持图片；不按服务商名称推断能力。
      x-tickets: ['02', '05']
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/subjects/{subject_id}/sources:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listSources
      tags: [Sources]
      summary: 列出资料库中的用户资料
      x-tickets: ['03', '05']
      responses:
        '200':
          description: 用户资料列表
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/SourceList
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: uploadSource
      tags: [Sources, Operations]
      summary: 上传用户资料并开始解析
      description: 支持 Markdown、TXT、PDF、DOCX、PPTX 和常见图片。相同内容复用解析缓存。
      x-tickets: ['03', '05']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./schemas.yaml#/components/schemas/SourceUpload
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: 文件超过允许大小
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: getSource
      tags: [Sources]
      summary: 读取用户资料
      x-tickets: ['03', '05']
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/Source}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteSource
      tags: [Sources]
      summary: 从资料库删除用户资料
      description: 停止后续检索；已被会话、试卷或学习产物引用的资料版本和来源引用仍可识别。
      x-tickets: ['03', '04']
      responses:
        '204': {description: 已从资料库删除}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/sources/{source_id}/versions:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: listSourceVersions
      tags: [Sources]
      summary: 列出资料版本
      x-tickets: ['03', '05']
      responses:
        '200':
          description: 资料版本列表
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/SourceVersionList}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createSourceVersion
      tags: [Sources, Operations]
      summary: 上传变更内容并创建资料版本
      x-tickets: ['03', '05']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: ./schemas.yaml#/components/schemas/SourceVersionUpload}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: 文件超过允许大小
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/source-versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/SourceVersionId'
    get:
      operationId: getSourceVersion
      tags: [Sources]
      summary: 读取资料版本及处理状态
      x-tickets: ['03', '05']
      responses:
        '200':
          description: 资料版本
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/SourceVersion}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/source-versions/{version_id}/anchors/{anchor_id}:
    parameters:
      - $ref: '#/components/parameters/SourceVersionId'
      - $ref: '#/components/parameters/AnchorId'
    get:
      operationId: getSourceAnchor
      tags: [Sources]
      summary: 读取稳定来源位置及上下文
      x-tickets: ['04', '05']
      responses:
        '200':
          description: 来源位置
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/SourceAnchor}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: 资料不可用，但历史引用仍存在
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}

  /api/source-versions/{version_id}/assets/{asset_id}:
    parameters:
      - $ref: '#/components/parameters/SourceVersionId'
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getSourceAsset
      tags: [Sources]
      summary: 读取资料版本中的图片或二进制资源
      x-tickets: ['05', '12']
      responses:
        '200':
          description: 原始资源字节
          content:
            image/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: 资料不可用
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ErrorResponse}

  /api/citations/{citation_id}:
    parameters:
      - $ref: '#/components/parameters/CitationId'
    get:
      operationId: getCitation
      tags: [Sources]
      summary: 解析来源引用并返回可复查上下文
      x-tickets: ['04', '05']
      responses:
        '200':
          description: 来源引用；资料不可用时 available=false，身份和位置仍保留
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/Citation}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/subjects/{subject_id}/chat:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: getChat
      tags: [Chat]
      summary: 读取完整会话记录
      x-tickets: ['02', '04', '06', '07', '12']
      responses:
        '200':
          description: 当前科目的会话记录
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/Chat}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: configureChat
      tags: [Chat]
      summary: 配置学习方式、资料范围和依据模式
      description: 切换学习方式不删除已有会话记录，也不隐式切换模型。
      x-tickets: ['04', '06', '07']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/ChatConfigPatch}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/Chat}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: clearChat
      tags: [Chat]
      summary: 删除当前科目的会话记录
      x-tickets: ['02']
      responses:
        '204': {description: 已删除会话消息，保留会话配置}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/subjects/{subject_id}/chat/model:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: switchChatModel
      tags: [Chat]
      summary: 主动切换当前会话使用的模型
      x-tickets: ['02']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/ChatModelInput}
      responses:
        '200':
          description: 已切换；历史消息模型快照不变
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/Chat}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/subjects/{subject_id}/chat/messages:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: createChatMessage
      tags: [Chat, Operations]
      summary: 发送问题、学习尝试或学习动作
      description: |
        依据 ChatMessageInput.intent 推进自由问答或苏格拉底式学习。选区问答把选区、所在题目和来源引用一起提交。
        响应只创建会话消息与异步任务，不会修改右侧试卷或学习产物。
      x-tickets: ['02', '04', '06', '12']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/ChatMessageInput}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/subjects/{subject_id}/chat/crash-course:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: generateCrashCourse
      tags: [Chat, Artifacts, Operations]
      summary: 生成章节速成学习产物
      x-tickets: ['07']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/CrashCourseInput}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/subjects/{subject_id}/chat/stop:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: stopSubjectChatGeneration
      tags: [Chat, Operations]
      summary: 停止当前科目的会话生成
      x-tickets: ['02']
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/generations/{generation_id}/stop:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    post:
      operationId: stopGeneration
      tags: [Chat, Operations]
      summary: 按兼容任务 ID 停止会话生成
      description: generation_id 与对应异步任务的 operation_id 相同；新客户端优先使用 operations 取消接口。
      deprecated: true
      x-tickets: ['02']
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/subjects/{subject_id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listArtifacts
      tags: [Artifacts]
      summary: 列出学习产物
      x-tickets: ['07']
      responses:
        '200':
          description: 学习产物列表
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/LearningArtifactList}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      operationId: getArtifact
      tags: [Artifacts]
      summary: 读取学习产物
      x-tickets: ['07']
      responses:
        '200':
          description: 学习产物
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/LearningArtifact}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteArtifact
      tags: [Artifacts]
      summary: 删除学习产物
      x-tickets: ['07']
      responses:
        '204': {description: 已删除；会话记录保留不可用的产物引用}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/subjects/{subject_id}/exam-blueprints:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listExamBlueprints
      tags: [Blueprints]
      summary: 列出组卷蓝图
      x-tickets: ['08']
      responses:
        '200':
          description: 组卷蓝图列表
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprintList}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: parseExamBlueprint
      tags: [Blueprints, Operations]
      summary: 把自然语言要求解析为组卷蓝图
      description: 只创建蓝图，不生成题目。
      x-tickets: ['08']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprintPromptInput}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/exam-blueprints/{blueprint_id}:
    parameters:
      - $ref: '#/components/parameters/BlueprintId'
    get:
      operationId: getExamBlueprint
      tags: [Blueprints]
      summary: 读取组卷蓝图
      x-tickets: ['08']
      responses:
        '200':
          description: 组卷蓝图
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprint}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateExamBlueprint
      tags: [Blueprints]
      summary: 修改组卷蓝图
      description: 修改已确认蓝图会把状态恢复为 draft，必须重新确认。
      x-tickets: ['08']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprintPatch}
      responses:
        '200':
          description: 已修改并重新校验约束
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprint}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteExamBlueprint
      tags: [Blueprints]
      summary: 删除未被试卷草稿引用的组卷蓝图
      x-tickets: ['08']
      responses:
        '204': {description: 已删除}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/exam-blueprints/{blueprint_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/BlueprintId'
    post:
      operationId: confirmExamBlueprint
      tags: [Blueprints]
      summary: 确认组卷蓝图
      description: 有 error 级约束冲突时返回 409，不触发题目生成。
      x-tickets: ['08']
      responses:
        '200':
          description: 已确认
          content:
            application/json:
              schema: {$ref: ./schemas.yaml#/components/schemas/ExamBlueprint}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/exam-blueprints/{blueprint_id}/generate:
    parameters:
      - $ref: '#/components/parameters/BlueprintId'
    post:
      operationId: generateExamDraft
      tags: [Blueprints, ExamDrafts, Operations]
