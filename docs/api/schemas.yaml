components:
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 200
      description: 不透明、稳定的资源 ID；客户端不得解析其格式。

    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: Unix 毫秒时间戳。

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: {type: boolean, const: false}
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
          minLength: 1
          description: 面向用户的中文错误说明。
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: 只包含安全、结构化的诊断信息，不包含凭据或完整资料。

    ErrorCode:
      type: string
      description: 稳定、可供客户端分支处理的错误码。
      enum:
        - VALIDATION_FAILED
        - RESOURCE_NOT_FOUND
        - RESOURCE_CONFLICT
        - STORAGE_WRITE_FAILED
        - INTERNAL_ERROR
        - SUBJECT_NAME_DUPLICATE
        - SUBJECT_DELETE_BLOCKED
        - MODEL_SERVICE_DUPLICATE
        - MODEL_CAPABILITY_UNSUPPORTED
        - MODEL_VERIFICATION_FAILED
        - MODEL_CONNECTION_FAILED
        - MODEL_HTTP_ERROR
        - MODEL_INVALID_RESPONSE
        - MODEL_API_FORMAT_UNSUPPORTED
        - MODEL_INPUT_UNSUPPORTED
        - SOURCE_TYPE_UNSUPPORTED
        - SOURCE_TOO_LARGE
        - SOURCE_PROCESSING_FAILED
        - SOURCE_UNAVAILABLE
        - SOURCE_VERSION_MISMATCH
        - CHAT_GENERATION_IN_PROGRESS
        - CHAT_MODEL_NOT_SELECTED
        - CHAT_SELECTION_INVALID
        - GROUNDING_SOURCE_REQUIRED
        - IMAGE_INPUT_UNSUPPORTED
        - BLUEPRINT_CONSTRAINT_CONFLICT
        - BLUEPRINT_NOT_CONFIRMED
        - QUESTION_STRUCTURE_INVALID
        - QUESTION_EVIDENCE_INCOMPLETE
        - QUESTION_GENERATION_FAILED
        - EXAM_VERSION_CONFLICT
        - REVISION_PROPOSAL_INVALID
        - REVISION_PROPOSAL_STALE
        - ATTEMPT_STATE_CONFLICT
        - ANSWER_TYPE_MISMATCH
        - ANSWER_NOT_AVAILABLE
        - FEEDBACK_UNAVAILABLE
        - EXPORT_ANSWER_NOT_ALLOWED
        - EXPORT_NOT_READY
        - OPERATION_IN_PROGRESS
        - OPERATION_NOT_CANCELABLE
        - EVALUATION_ALREADY_RUNNING
        - SESSION_NAME_DUPLICATE
        - SESSION_NOT_FOUND
        - SESSION_SOURCE_CONFLICT
        - ATTACHMENT_NOT_FOUND
        - ATTACHMENT_EXPIRED
        - MODEL_DISCOVERY_UNSUPPORTED
        - MODEL_DISCOVERY_FAILED
        - MODEL_MANUAL_NAME_REQUIRED
        - AI_DOCUMENT_READ_ONLY
        - AI_DOCUMENT_VERSION_CONFLICT
        - AI_DOCUMENT_PROPOSAL_INVALID
        - ATTEMPT_ALREADY_COMPLETED
        - ATTEMPT_NOT_COMPLETED
        - GRADING_ALREADY_REQUESTED
        - GRADING_STALE

    ResourceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [model, source, source-version, chat-message, learning-artifact, exam-blueprint, exam-draft, question, exam, attempt, feedback, revision-proposal, draft-revision-proposal, export, evaluation-run, session, attachment, ai-document, ai-document-version, ai-document-proposal]
        id: {$ref: '#/components/schemas/Identifier'}

    OperationKind:
      type: string
      enum:
        - model-verification
        - source-parsing
        - chat-generation
        - crash-course-generation
        - blueprint-parsing
        - exam-generation
        - question-retry
        - subjective-feedback
        - attempt-grading
        - exam-revision
        - ai-document-generation
        - ai-document-revision
        - exam-export
        - evaluation

    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, cancelable, progress, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {$ref: '#/components/schemas/OperationKind'}
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceling, canceled]
        cancelable: {type: boolean}
        progress:
          type: object
          additionalProperties: false
          required: [completed, total]
          properties:
            completed: {type: integer, minimum: 0}
            total: {type: [integer, 'null'], minimum: 0}
            message: {type: [string, 'null']}
        subject_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        resource:
          anyOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
        result:
          anyOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        started_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completed_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: {$ref: '#/components/schemas/Operation'}
        resource:
          anyOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
      example:
        operation:
          id: operation-1
          kind: chat-generation
          status: queued
          cancelable: true
          progress: {completed: 0, total: 1, message: 等待处理}
          subject_id: subject-1
          resource: {type: chat-message, id: message-1}
          result: null
          error: null
          created_at: 1735689600000
          updated_at: 1735689600000
          started_at: null
          completed_at: null
        resource: {type: chat-message, id: message-1}

    SubjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    Subject:
      type: object
      additionalProperties: false
      required: [id, name, active, counts, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string, minLength: 1, maxLength: 80}
        active: {type: boolean}
        counts:
          type: object
          additionalProperties: false
          required: [sources, artifacts, exam_blueprints, exam_drafts, exams]
          properties:
            sources: {type: integer, minimum: 0}
            artifacts: {type: integer, minimum: 0}
            exam_blueprints: {type: integer, minimum: 0}
            exam_drafts: {type: integer, minimum: 0}
            exams: {type: integer, minimum: 0}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}

    SubjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Subject'}

    Workspace:
      type: object
      additionalProperties: false
      required: [schema_version, active_subject_id, subjects, models]
      properties:
        schema_version: {type: integer, minimum: 1}
        active_subject_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        subjects:
          type: array
          items: {$ref: '#/components/schemas/Subject'}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelService'}
        load_issue: {type: [string, 'null']}

    ModelCapabilities:
      type: object
      additionalProperties: false
      required: [text, vision, source]
      properties:
        text: {type: boolean}
        vision: {type: boolean}
        source:
          type: string
          enum: [configured, verified]

    ModelValidation:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [unknown, checking, ok, error]
        checked_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        message: {type: [string, 'null']}

    ModelServiceInput:
      type: object
      additionalProperties: false
      required: [provider, api_format, model, base_url]
      properties:
        provider: {type: string, minLength: 1, maxLength: 60}
        api_format: {$ref: '#/components/schemas/ApiFormat'}
        model: {type: string, minLength: 1, maxLength: 120}
        base_url: {type: string, format: uri, minLength: 1, maxLength: 500}
        api_key:
          type: string
          maxLength: 2000
          writeOnly: true
        capabilities: {$ref: '#/components/schemas/ModelCapabilitiesInput'}

    ModelServicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        provider: {type: string, minLength: 1, maxLength: 60}
        api_format: {$ref: '#/components/schemas/ApiFormat'}
        model: {type: string, minLength: 1, maxLength: 120}
        base_url: {type: string, format: uri, minLength: 1, maxLength: 500}
        api_key:
          type: [string, 'null']
          maxLength: 2000
          writeOnly: true
          description: null 表示清除，省略表示保持不变。
        capabilities: {$ref: '#/components/schemas/ModelCapabilitiesInput'}

    ModelCapabilitiesInput:
      type: object
      additionalProperties: false
      required: [text, vision]
      properties:
        text: {type: boolean, const: true}
        vision: {type: boolean}

    ModelService:
      type: object
      additionalProperties: false
      required: [id, provider, api_format, model, base_url, has_api_key, capabilities, validation, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        provider: {type: string}
        api_format: {$ref: '#/components/schemas/ApiFormat'}
        model: {type: string}
        base_url: {type: string, format: uri}
        has_api_key: {type: boolean}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
        validation: {$ref: '#/components/schemas/ModelValidation'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
      example:
        id: model-1
        provider: Ollama
        api_format: ollama
        model: qwen2.5:7b
        base_url: http://localhost:11434
        has_api_key: false
        capabilities: {text: true, vision: false, source: configured}
        validation: {status: unknown, checked_at: null, message: null}
        created_at: 1735689600000
        updated_at: 1735689600000

    ModelServiceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelService'}

    SourceStatus:
      type: string
      enum: [processing, ready, failed, unavailable]

    SourceUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, format: binary}
        display_name: {type: string, minLength: 1, maxLength: 255}

    SourceVersionUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, format: binary}

    Source:
      type: object
      additionalProperties: false
      required: [id, subject_id, display_name, media_kind, status, current_version, version_count, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        subject_id: {$ref: '#/components/schemas/Identifier'}
        display_name: {type: string}
        media_kind:
          type: string
          enum: [markdown, text, pdf, docx, pptx, image]
        status: {$ref: '#/components/schemas/SourceStatus'}
        current_version:
          anyOf:
            - $ref: '#/components/schemas/SourceVersionSummary'
            - type: 'null'
        version_count: {type: integer, minimum: 0}
        failure:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}

    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Source'}

    SourceVersionSummary:
      type: object
      additionalProperties: false
      required: [id, number, status, content_hash, mime_type, size_bytes, anchor_count, cache_hit, created_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        number: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/SourceStatus'}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        mime_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
        anchor_count: {type: integer, minimum: 0}
        cache_hit: {type: boolean}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        processed_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    SourceVersion:
      type: object
      additionalProperties: false
      required: [id, source_id, number, status, content_hash, mime_type, size_bytes, anchor_count, cache_hit, assets, created_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        source_id: {$ref: '#/components/schemas/Identifier'}
        number: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/SourceStatus'}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        mime_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
        anchor_count: {type: integer, minimum: 0}
        cache_hit: {type: boolean}
        assets:
          type: array
          items: {$ref: '#/components/schemas/SourceAsset'}
        failure:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at: {$ref: '#/components/schemas/Timestamp'}
        processed_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    SourceVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SourceVersionSummary'}

    SourceAsset:
      type: object
      additionalProperties: false
      required: [id, kind, mime_type]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, enum: [image, attachment]}
        mime_type: {type: string}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        alt: {type: [string, 'null']}

    SourceLocation:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [section, paragraph, page, table, slide, image]
        label: {type: string, minLength: 1}
        section_path:
          type: array
          items: {type: string}
        page: {type: [integer, 'null'], minimum: 1}
        slide: {type: [integer, 'null'], minimum: 1}
        block_index: {type: [integer, 'null'], minimum: 0}
        asset_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'

    SourceAnchor:
      type: object
      additionalProperties: false
      required: [id, source_id, source_version_id, location, content, available]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        source_id: {$ref: '#/components/schemas/Identifier'}
        source_version_id: {$ref: '#/components/schemas/Identifier'}
        location: {$ref: '#/components/schemas/SourceLocation'}
        content:
          type: array
          items: {$ref: '#/components/schemas/ContentBlock'}
        available: {type: boolean}

    SourceAnchorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SourceAnchor'}
      example:
        items:
          - id: anchor-1
            source_id: source-1
            source_version_id: source-version-1
            location: {kind: section, label: Limits, section_path: [Limits], page: null, slide: null, block_index: 0, asset_id: null}
            content: [{id: block-1, type: markdown, text: Limits describe nearby behavior.}]
            available: true

    Citation:
      type: object
      additionalProperties: false
      required: [id, source_id, source_version_id, anchor_id, source_name, location, available]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        source_id: {$ref: '#/components/schemas/Identifier'}
        source_version_id: {$ref: '#/components/schemas/Identifier'}
        anchor_id: {$ref: '#/components/schemas/Identifier'}
        source_name: {type: string}
        location: {$ref: '#/components/schemas/SourceLocation'}
        excerpt: {type: [string, 'null'], maxLength: 1000}
        available: {type: boolean}

    ContentBlock:
      oneOf:
        - $ref: '#/components/schemas/MarkdownBlock'
        - $ref: '#/components/schemas/LatexBlock'
        - $ref: '#/components/schemas/TableBlock'
        - $ref: '#/components/schemas/ImageBlock'
      discriminator:
        propertyName: type
        mapping:
          markdown: '#/components/schemas/MarkdownBlock'
          latex: '#/components/schemas/LatexBlock'
          table: '#/components/schemas/TableBlock'
          image: '#/components/schemas/ImageBlock'

    MarkdownBlock:
      type: object
      additionalProperties: false
      required: [id, type, text]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, const: markdown}
        text: {type: string}

    LatexBlock:
      type: object
      additionalProperties: false
      required: [id, type, latex, display]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, const: latex}
        latex: {type: string}
        display: {type: boolean}

    TableBlock:
      type: object
      additionalProperties: false
      required: [id, type, columns, rows]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, const: table}
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items:
            type: array
            items: {type: string}

    ImageBlock:
      type: object
      additionalProperties: false
      required: [id, type, asset]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, const: image}
        asset: {$ref: '#/components/schemas/AssetReference'}
        alt: {type: [string, 'null']}
        caption: {type: [string, 'null']}

    AssetReference:
      type: object
      additionalProperties: false
      required: [source_version_id, asset_id]
      properties:
        source_version_id: {$ref: '#/components/schemas/Identifier'}
        asset_id: {$ref: '#/components/schemas/Identifier'}

    GroundingMode:
      type: string
      enum: [strict, general-knowledge, supplemental]

    ApiFormat:
      type: string
      enum: [openai-chat-completions, openai-responses, ollama]

    ChatStyle:
      type: string
      enum: [default, socratic, crash-course]

    LearningMode:
      type: string
      enum: [chat, socratic, crash-course]

    ModelSnapshot:
      type: object
      additionalProperties: false
      required: [model_id, provider, api_format, model, base_url, capabilities]
      properties:
        model_id: {$ref: '#/components/schemas/Identifier'}
        provider: {type: string}
        api_format: {$ref: '#/components/schemas/ApiFormat'}
        model: {type: string}
        base_url: {type: string, format: uri}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}

    ChatConfigPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        chat_style: {$ref: '#/components/schemas/ChatStyle'}
        learning_mode:
          allOf: [{$ref: '#/components/schemas/LearningMode'}]
          deprecated: true
        goal: {type: [string, 'null'], maxLength: 2000}
        grounding_mode: {$ref: '#/components/schemas/GroundingMode'}
        source_version_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}

    ChatModelInput:
      type: object
      additionalProperties: false
      required: [model_id]
      properties:
        model_id: {$ref: '#/components/schemas/Identifier'}

    SelectionContext:
      type: object
      additionalProperties: false
      required: [document_kind, document_id, version_id]
      properties:
        document_kind:
          type: string
          enum: [exam-draft, exam, learning-artifact]
        document_id: {$ref: '#/components/schemas/Identifier'}
        version_id: {$ref: '#/components/schemas/Identifier'}
        question_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        block_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        citation_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        selected_text: {type: string, minLength: 1, maxLength: 20000}
        image_asset: {$ref: '#/components/schemas/AssetReference'}
      oneOf:
        - required: [selected_text]
          not: {required: [image_asset]}
        - required: [image_asset]
          not: {required: [selected_text]}

    ChatMessageIntent:
      type: string
      deprecated: true
      description: v0.1 兼容字段；不再驱动教学流程。
      enum: [start, ask, attempt, request-hint, request-explanation, restate, request-self-test, self-test-answer]

    ChatMessageInput:
      type: object
      additionalProperties: false
      properties:
        intent:
          allOf: [{$ref: '#/components/schemas/ChatMessageIntent'}]
          default: ask
          deprecated: true
        content: {type: string, minLength: 1, maxLength: 20000}
        chat_style: {$ref: '#/components/schemas/ChatStyle'}
        model_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        source_version_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        grounding_mode: {$ref: '#/components/schemas/GroundingMode'}
        selection: {$ref: '#/components/schemas/SelectionContext'}
        focused_source_version_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
          description: "@资料点名的重点资料版本；只影响检索排序。"
        only_use_specified_sources:
          type: boolean
          default: false
          description: 显式为 true 时仅检索本请求指定的资料版本。
        attachment_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
      allOf:
        - if:
            properties:
              intent: {enum: [ask, attempt, restate, self-test-answer]}
          then:
            required: [content]
      example:
        intent: ask
        content: 请结合重点资料解释这个概念
        source_version_ids: [source-version-1]
        focused_source_version_ids: [source-version-1]
        only_use_specified_sources: false
        attachment_ids: []

    ChatMessageRetryInput:
      type: object
      additionalProperties: false
      properties:
        model_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'

    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, role, intent, chat_style, content, status, citations, source_context, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        role: {type: string, enum: [user, assistant, system]}
        intent:
          allOf: [{$ref: '#/components/schemas/ChatMessageIntent'}]
          deprecated: true
        chat_style: {$ref: '#/components/schemas/ChatStyle'}
        content:
          type: array
          items: {$ref: '#/components/schemas/ContentBlock'}
        status: {type: string, enum: [queued, generating, complete, stopped, error]}
        grounding_mode:
          anyOf:
            - $ref: '#/components/schemas/GroundingMode'
            - type: 'null'
        grounding_result:
          type: [string, 'null']
          enum: [covered, not-covered, general-knowledge, supplemental, null]
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        source_context: {$ref: '#/components/schemas/MessageSourceContext'}
        selection:
          anyOf:
            - $ref: '#/components/schemas/SelectionContext'
            - type: 'null'
        model:
          anyOf:
            - $ref: '#/components/schemas/ModelSnapshot'
            - type: 'null'
        error:
          anyOf:
